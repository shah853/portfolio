<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the portfolio, projects, skills, and certificates of Muhammad Shah, a Full Stack (MERN) Developer."
    />
    <meta name="theme-color" content="#6366f1" />
    <script>
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme !== 'light') {
          document.documentElement.classList.add('dark');
        }
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
    <title>Muhammad Shah | Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
